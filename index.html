<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda Natural</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar navbar-dark bg-success px-3 fixed-top">
  <a class="navbar-brand fw-bold" href="#">🌿 Tienda Natural</a>

  <a class="text-white ms-auto me-3" href="#productos">Productos</a>
  <a class="text-white" href="#contacto">Contacto</a>
</nav>

<div id="carousel" class="carousel slide mt-5" data-bs-ride="carousel">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="https://images.unsplash.com/photo-1542838132-92c53300491e" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307" class="d-block w-100">
    </div>

  </div>

</div>

<div class="text-center my-4">
  <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalOferta">
    Ver Oferta Especial
  </button>
</div>

<section id="productos" class="container py-5">

  <h2 class="text-center mb-4 fade-in">Productos Naturales</h2>

  <div class="row g-4">

    <div class="col-md-4 fade-in">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce">
        <div class="card-body text-center">
          <h5>Frutas</h5>
        </div>
      </div>
    </div>

    <div class="col-md-4 fade-in">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999">
        <div class="card-body text-center">
          <h5>Verduras</h5>
        </div>
      </div>
    </div>

    <div class="col-md-4 fade-in">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307">
        <div class="card-body text-center">
          <h5>Jugos</h5>
        </div>
      </div>
    </div>

  </div>

</section>

<section id="contacto" class="container py-5 fade-in">

  <h2 class="text-center mb-4">Contacto</h2>

  <form onsubmit="enviar(event)" class="p-4 shadow bg-light rounded">

    <input class="form-control mb-2" placeholder="Nombre" required>
    <input class="form-control mb-2" placeholder="Correo" required>
    <textarea class="form-control mb-3" placeholder="Mensaje"></textarea>

    <button class="btn btn-success w-100">Enviar</button>

  </form>

</section>

<button id="topBtn">↑</button>

<footer class="bg-success text-white text-center p-3">
  © 2026 Tienda Natural. Todos los derechos reservados.
</footer>

<div class="modal fade" id="modalOferta">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>🔥 Oferta Especial</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        Descuento del 30% en frutas orgánicas hoy.
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
